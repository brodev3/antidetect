  better-sqlite3: true
  "@scarf/scarf@1.4.0": false

overrides:
  fastify: 5.12.5
  # Swagger pins js-yaml exactly; apply its security fix within the same major.
  "@nestjs/swagger@11.4.7>js-yaml": 5.4.1
